[metadata]
name = tsdiscovery_variablelags
version = 1.0.0

[options]
python_requires = >=3.12
py_modules =
    variable_lag_tabu
    variable_lag_tabu_parallel
    real_world_application
    sweep_variable_lag_bn
    analysis
    make_sweep_panels
package_dir =
    = src
install_requires = 
    numpy
    pandas
    matplotlib

[options.entry_points]
console_scripts =
    real-world-application = real_world_application:main
    sweep-variable-lag-bn = sweep_variable_lag_bn:main
    tsdiscovery-analysis = analysis:main
    make-sweep-panels = make_sweep_panels:main
